services:
  # --- Infra interna (no expuesta) ---
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web

      
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- Backend API (interno; publicado por el gateway) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: [ NODE_ENV=production ]
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Worker Python (interno) ---
  worker:
    build:
      context: ./worker_py
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # --- Gateway Nginx (único puerto público) ---
  gateway:
    build:
      context: .
      dockerfile: ./gateway.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8070:80"   # 👈 único puerto público
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
