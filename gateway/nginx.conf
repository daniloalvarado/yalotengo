user  nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on; tcp_nopush on; keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  upstream backend_upstream {
    server backend:3000;
    keepalive 32;
  }

  server {
    listen 80;

    # Headers básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (SPA)
    root /usr/share/nginx/html;
    index index.html;

    # Assets fingerprinted cacheables
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|gif)$ {
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
      proxy_pass         http://backend_upstream/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout  300;
      proxy_send_timeout  300;
    }

        # Callbacks OAuth sin /api
    # Callbacks OAuth sin /api
    location /oauth/ {
      proxy_pass         http://backend_upstream/oauth/;   
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy para archivos subidos (MinIO via Backend)
    location /uploads/ {
      proxy_pass         http://backend_upstream/uploads/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout  300;
      proxy_send_timeout  300;
    }


    # WebSockets
    location /ws/ {
      proxy_pass         http://backend_upstream/ws/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout  3600;
      proxy_send_timeout  3600;
    }
  }
}
